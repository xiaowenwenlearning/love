<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>《汉字组词多巴胺乐园》</title>
    <style>
        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 99%, #fad0c4 100%);
            background-attachment: fixed;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        #login-box, #game-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 35px;
            border-radius: 25px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.2);
            margin-top: 30px;
            text-align: center;
            max-width: 950px;
            width: 92%;
        }

        .hidden { display: none !important; }

        .btn {
            padding: 12px 35px;
            font-size: 20px;
            cursor: pointer;
            background: #ff4081;
            color: white;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(255, 64, 129, 0.4);
            transition: all 0.2s;
        }
        .btn:hover { transform: scale(1.05); background: #f50057; }

        /* 游戏区域布局 */
        .row-section {
            margin: 15px 0;
            padding: 15px;
            background: #fdfbfb;
            border-radius: 15px;
            border: 2px dashed #ff80ab;
        }
        .row-title {
            font-size: 16px;
            color: #d81b60;
            margin-bottom: 10px;
            font-weight: bold;
            text-align: left;
        }

        /* 第一排汉字：完美居中分布，允许换行 */
        .card-container-row1 {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 12px;
            padding: 5px 0;
        }

        /* 第二、三排组合卡片：居中均匀分布 */
        .card-container-row23 {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 15px;
            padding: 5px 0;
        }

        /* 汉字卡片/槽位样式 */
        .slot, .card {
            width: 65px;
            height: 65px;
            background: #fff;
            border: 3px solid #ff4081;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            color: #333;
            cursor: pointer;
            box-shadow: 0 4px 0 #c51162;
            user-select: none;
            transition: all 0.2s;
        }
        .card.selected { background: #ffeb3b; border-color: #fbc02d; transform: translateY(-3px); }
        .slot { background: #f8bbd0; border-style: dashed; color: #880e4f; }
        .slot.filled { background: #e1bee7; border-style: solid; border-color: #8e24aa; }

        /* 组词组合卡片样式（括号与固定字） */
        .word-group-box {
            display: flex;
            align-items: center;
            background: #fff;
            border: 2px solid #ab47bc;
            border-radius: 12px;
            padding: 8px 14px;
            gap: 10px;
            box-shadow: 0 3px 0 #7b1fa2;
            font-size: 26px;
            font-weight: bold;
            color: #4a148c;
        }

        /* 计时器与关卡信息 */
        .hud {
            display: flex;
            justify-content: space-between;
            font-size: 20px;
            font-weight: bold;
            color: #ad1457;
            margin-bottom: 15px;
            background: #fce4ec;
            padding: 10px 20px;
            border-radius: 12px;
        }

        /* 过关庆祝层 */
        #finish-screen {
            text-align: center;
            padding: 20px;
        }
        .avatar-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            font-size: 50px;
            margin: 20px 0;
            animation: bounce 1s infinite alternate;
        }
        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-10px); }
        }

        .footer-nav { position: fixed; bottom: 15px; width: 100%; text-align: center; }
    </style>
</head>
<body>

    <!-- 音效文件引入 -->
    <audio id="snd-melt" src="../audio/melt.MP3"></audio>
    <audio id="snd-wrong" src="../audio/wrong.MP3"></audio>

    <!-- 登录面板 -->
    <div id="login-box">
        <h2 id="page-display-title" style="color: #d81b60;">🌟 汉字组词多巴胺乐园 🌟</h2>
        <p style="color: #666;">请输入您的姓名和练习密码登录</p>
        <div style="margin: 20px 0;">
            <input type="text" id="username" placeholder="学生姓名 (如 Wenwen)" style="padding:12px; width:240px; border-radius:10px; border:2px solid #ff80ab; font-size:16px;"><br><br>
            <input type="password" id="password" placeholder="练习密码 (如 168)" style="padding:12px; width:240px; border-radius:10px; border:2px solid #ff80ab; font-size:16px;">
        </div>
        <button class="btn" onclick="login()">确认登录 Start</button>
    </div>

    <!-- 游戏主容器 -->
    <div id="game-container" class="hidden">
        <div id="instruction">
            <h2 style="color:#d81b60;">欢迎来到闯关游戏！</h2>
            <p style="color:#555; font-size: 18px;">规则：在2分钟内完成当前页的组词，做完所有5页后才会进行最终结算！</p>
            <button class="btn" style="font-size:24px; padding:15px 40px;" onclick="startGame()">开始闯关 GO!</button>
        </div>

        <div id="game-board" class="hidden">
            <div class="hud">
                <span id="level-indicator">当前进度: 第 1 / 5 页</span>
                <span id="timer">剩余时间: 02:00</span>
            </div>

            <!-- 第一排：待选汉字（居中分布、自动换行） -->
            <div class="row-section">
                <div class="row-title">📌 第一排：待选汉字（点击选择）</div>
                <div id="row1-container" class="card-container-row1"></div>
            </div>

            <!-- 第二排：第1个固定字及所有组合 -->
            <div class="row-section">
                <div class="row-title" id="row2-title">🧩 第二排组词练习</div>
                <div id="row2-container" class="card-container-row23"></div>
            </div>

            <!-- 第三排：第2个固定字及所有组合 -->
            <div class="row-section">
                <div class="row-title" id="row3-title">🧩 第三排组词练习</div>
                <div id="row3-container" class="card-container-row23"></div>
            </div>
            
            <button class="btn" style="margin-top: 15px; background: #ab47bc;" onclick="nextPage()">进入下一页 🚀</button>
        </div>

        <!-- 最终总结算界面 -->
        <div id="finish-screen" class="hidden">
            <div class="avatar-container">
                <span>🐱</span><span>🦄</span><span>🌸</span><span>⭐</span><span>🍦</span>
            </div>
            <h1 style="color:#e91e63; font-size: 36px;">🎉 太棒了！全部5页顺利通关！ 🎉</h1>
            <p id="praise-text" style="font-size: 22px; color: #880e4f; font-weight: bold; margin: 15px 0;"></p>
            <button class="btn" style="background: #4caf50; font-size: 22px;" onclick="location.reload()">再玩一次 🔄</button>
        </div>
    </div>

    <div class="footer-nav">
        <button class="btn" style="background:#2196f3; padding: 8px 20px; font-size: 16px;" onclick="location.href='../index.html'">回主页 Home</button>
    </div>

    <script>
        const CONFIG = {
            csvPath: 'new.csv',          
            userPath: '../user/use.txt',     
            startRow: 1,                     
            colIndex: 1,                     
            maxRows: 13                      
        };

        let currentUser = "";
        let pagesData = [];  // 共5页
        let currentPageIdx = 0;
        let timerInterval = null;
        let timeLeft = 120;   
        let selectedCardVal = null; 

        async function login() {
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value.trim();
            if(!u || !p) return alert("请输入姓名和密码！");

            try {
                const resp = await fetch(CONFIG.userPath);
                const text = await resp.text();
                const auth = text.split(/\r?\n/).some(line => {
                    const ps = line.split('\t');
                    return ps[0]?.trim() === u && ps[1]?.trim() === p;
                });

                if (auth) {
                    currentUser = u;
                    document.getElementById('login-box').classList.add('hidden');
                    document.getElementById('game-container').classList.remove('hidden');
                    await loadCSVLevels();
                } else { 
                    alert("登录失败：用户名或密码错误！"); 
                }
            } catch (e) { 
                console.error(e);
                alert("读取本地 user/use.txt 失败，请检查路径。"); 
            }
        }

        async function loadCSVLevels() {
            try {
                const resp = await fetch(CONFIG.csvPath);
                const text = await resp.text();
                const rows = text.split(/\r?\n/).map(r => r.split(','));
                
                pagesData = [];
                for (let i = CONFIG.startRow; i < rows.length; i += 4) {
                    if (i + 3 >= rows.length) break;
                    
                    const row1 = rows[i].slice(1, 11).map(s => s?.trim()).filter(s => s);
                    if (row1.length === 0) continue;

                    const row2Base = rows[i+1].slice(1, 11).map(s => s?.trim());
                    const row2Pos = rows[i+2].slice(1, 11).map(s => s?.trim());
                    const row2Ans = rows[i+3].slice(1, 11).map(s => s?.trim());

                    // 10个固定字按每页2个，刚好分为 5 页
                    for (let col = 0; col < 10; col += 2) {
                        const subItems = [];
                        for (let c = col; c < col + 2 && c < 10; c++) {
                            const base = row2Base[c];
                            if (!base) continue;
                            const pos = (row2Pos[c] || 'L').toUpperCase();
                            const answersStr = row2Ans[c] || '';
                            const ansList = answersStr.split(/[,，]/).map(s => s.trim()).filter(s => s);

                            subItems.push({
                                base: base,
                                pos: pos,
                                answers: ansList
                            });
                        }

                        if (subItems.length > 0) {
                            pagesData.push({
                                row1: row1,
                                items: subItems 
                            });
                        }
                    }
                }

                if (pagesData.length === 0) {
                    alert("未能从CSV中解析出有效关卡，请检查格式！");
                }
            } catch (e) {
                console.error(e);
                alert("读取CSV文件出错，请确保同级目录下有正确格式的CSV文件。");
            }
        }

        function startGame() {
            if (pagesData.length === 0) return alert("当前没有加载到可用关卡！");
            document.getElementById('instruction').classList.add('hidden');
            document.getElementById('game-board').classList.remove('hidden');
            loadPage(currentPageIdx);
            startTimer();
        }

        function loadPage(idx) {
            const pageData = pagesData[idx];
            document.getElementById('level-indicator').innerText = `当前进度: 第 ${idx + 1} / ${pagesData.length} 页`;

            // 第一排待选汉字（居中自适应换行）
            const r1Container = document.getElementById('row1-container');
            r1Container.innerHTML = '';
            pageData.row1.forEach(char => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerText = char;
                card.onclick = () => {
                    document.querySelectorAll('#row1-container .card').forEach(c => c.classList.remove('selected'));
                    card.classList.add('selected');
                    selectedCardVal = char;
                };
                r1Container.appendChild(card);
            });

            // 第二排：第1个固定字及所有组合
            renderRowWithSlots('row2-container', 'row2-title', pageData.items[0], '第二排');
            
            // 第三排：第2个固定字及所有组合
            if (pageData.items[1]) {
                renderRowWithSlots('row3-container', 'row3-title', pageData.items[1], '第三排');
            } else {
                document.getElementById('row3-container').innerHTML = '<span style="color:#888;">本页无更多固定字</span>';
                document.getElementById('row3-title').innerText = '第三排组词练习';
            }
        }

        function renderRowWithSlots(containerId, titleId, itemData, rowName) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            document.getElementById(titleId).innerText = `${rowName}组词（固定字：${itemData.base}）`;

            itemData.answers.forEach((ans, ansIdx) => {
                const pos = itemData.pos;
                let actualPos = pos;
                if (pos === 'LR') {
                    actualPos = (ansIdx % 2 === 0) ? 'L' : 'R';
                }

                const groupDiv = document.createElement('div');
                groupDiv.className = 'word-group-box';

                const slot = document.createElement('div');
                slot.className = 'slot';
                slot.dataset.base = itemData.base;
                slot.dataset.targetAnswer = ans;
                slot.onclick = handleSlotClick;

                const baseSpan = document.createElement('span');
                baseSpan.innerText = itemData.base;

                if (actualPos === 'L') {
                    groupDiv.appendChild(slot);
                    groupDiv.appendChild(baseSpan);
                } else {
                    groupDiv.appendChild(baseSpan);
                    groupDiv.appendChild(slot);
                }

                container.appendChild(groupDiv);
            });
        }

        function handleSlotClick() {
            if (!selectedCardVal) {
                document.getElementById('snd-wrong').currentTime = 0;
                document.getElementById('snd-wrong').play().catch(e => {});
                alert("请先点击上方“第一排”选择一个汉字！");
                return;
            }
            this.innerText = selectedCardVal;
            this.classList.add('filled');
            
            document.getElementById('snd-melt').currentTime = 0;
            document.getElementById('snd-melt').play().catch(e => {});

            selectedCardVal = null;
            document.querySelectorAll('#row1-container .card').forEach(c => c.classList.remove('selected'));
        }

        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = 120;
            updateTimerDisplay();
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    document.getElementById('snd-wrong').currentTime = 0;
                    document.getElementById('snd-wrong').play().catch(e => {});
                    alert("时间到！再接再厉哦！");
                    loadPage(currentPageIdx);
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const m = String(Math.floor(timeLeft / 60)).padStart(2, '0');
            const s = String(timeLeft % 60).padStart(2, '0');
            document.getElementById('timer').innerText = `剩余时间: ${m}:${s}`;
        }

        // 点击进入下一页，直到完成全部5页后才进入总结算
        function nextPage() {
            currentPageIdx++;
            if (currentPageIdx < pagesData.length) {
                document.getElementById('snd-melt').currentTime = 0;
                document.getElementById('snd-melt').play().catch(e => {});
                loadPage(currentPageIdx);
            } else {
                // 全部5页做完后，触发最终总结算
                clearInterval(timerInterval);
                document.getElementById('snd-melt').currentTime = 0;
                document.getElementById('snd-melt').play().catch(e => {});

                document.getElementById('game-board').classList.add('hidden');
                document.getElementById('finish-screen').classList.remove('hidden');

                const praises = [
                    "太厉害了！你顺利完成了全部5页闯关，是最棒的小汉字专家！🌟",
                    "全部通关啦！老师为你竖起大拇指！👍",
                    "哇塞，全部练习完美搞定，进步神速！🎉",
                    "聪明的宝贝，所有的汉字都难不倒你！🎈"
                ];
                document.getElementById('praise-text').innerText = praises[Math.floor(Math.random() * praises.length)];
            }
        }
    </script>
</body>
</html>
